# Compila la app Android «Kiosko Ohana» y deja el .apk para descargar
# Enlace fijo para bajarla desde la tablet:
#   https://github.com/ohana-kiosko/kiosko/releases/latest/download/kiosko-ohana.apk
name: App Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # La misma firma en cada versión para poder actualizar la app sin desinstalarla (desinstalar borra lo guardado en la
      # tablet). Se guarda en la caché privada de Actions del repositorio; nunca va en el código. Dueño, 21 nov 2026.
      - name: Firma guardada
        uses: actions/cache@v4
        with:
          path: android/app/firma.jks
          key: firma-kiosko-v1
      - name: Firma e icono
        env:
          FIRMA: ${{ secrets.ANDROID_FIRMA_B64 }}
        run: |
          # Firma fija guardada como secreto del repositorio (ANDROID_FIRMA_B64). Sin ella se crea una
          # provisional: sirve para probar, pero cada versión nueva obliga a desinstalar la anterior.
          if [ -n "$FIRMA" ]; then echo "$FIRMA" | base64 -d > android/app/firma.jks
          elif [ -s android/app/firma.jks ]; then echo "Firma guardada de la versión anterior"
          else keytool -genkeypair -keystore android/app/firma.jks -storetype PKCS12 -alias kiosko -keyalg RSA -keysize 2048 -validity 15000 -storepass ohana-kiosko -keypass ohana-kiosko -dname "CN=Kiosko Ohana"; echo "::warning::Firma provisional"; fi
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > android/gradle.properties
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      # SDK de las tablets KOZEN (la del kiosko es una Nebullar P18): impresora y cajón. No se guarda en el repositorio;
      # se baja del plugin público kozen_printer (classes-2.1.17.jar) y se comprueba su huella. Dueño, 25 nov 2026.
      - name: SDK de la tablet Kozen
        run: |
          mkdir -p android/app/libs
          curl -fsSL -o android/app/libs/kozen-sdk.jar https://raw.githubusercontent.com/tjgs-my-id/kozen_printer/0996727eb5e541b882814e792a1da5aa59c41e8e/android/lib/classes-2.1.17.jar
          echo "57fdff2c497d93d76bf1515c74e8cf0582b5bc81f685e1736a5e3f150aceb5b6  android/app/libs/kozen-sdk.jar" | sha256sum -c -
      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --stacktrace
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kiosko-ohana.apk
          gh release create "app-${{ github.run_number }}" kiosko-ohana.apk --latest \
            --title "App Kiosko Ohana 1.${{ github.run_number }}" \
            --notes "App Android del kiosko (pantalla completa + cobro con tarjeta en la tablet). Descarga: kiosko-ohana.apk"
