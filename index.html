<!doctype html><html><head><meta charset=utf8><title>Kiosko Ohana Surf</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1A1714"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gestión Kiosko Tres Piedras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: TPV táctil de chiringuito. Menú lateral con dos grupos (día a día / administración), botones grandes para dedos, acento naranja atardecer sobre arena clara. */
:root{
  --bg:#F1EFEA; --panel:#FFFFFF; --ink:#1A1714; --muted:#5E5850; --line:#E2DDD3; --soft:#F8F6F1;
  --side:#1A1714; --side-ink:#E6E0D6; --side-mute:#9C9488;
  --accent:#C2560F; --accent-ink:#FFFFFF; --accent-soft:#FBE7D6;
  --sea:#0B6670; --sea-soft:#DDF0F1;
  --warn:#8A4B00; --warn-bg:#FDF0DD; --bad:#A3231F; --bad-bg:#FCE4E2; --ok:#0B5A3A; --ok-bg:#E1F5EA;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --body:Inter,ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid #F2A33A;outline-offset:2px}
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:3px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;align-self:flex-start}
.app{background:linear-gradient(90deg,var(--side) 236px,var(--bg) 236px)}
.brand{background:#EF8C67;border-radius:12px;padding:6px;margin:0 0 6px;display:block}
.brand img{display:block;width:100%;height:auto}
.sede{font-size:13px;color:var(--side-mute);padding:0 10px 12px;border-bottom:1px solid #332E28;margin-bottom:6px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mute);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14.5px}
.nav a:hover{background:#2A2520}
.nav a.on{background:#fff;color:var(--side);font-weight:600}
.nav a.locked{color:#6F675C}
.nav .ni{flex:none;color:var(--side-mute)}
.nav a.on .ni{color:var(--accent)}
.badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid #332E28;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-mute)}
.who b{color:#fff;font-size:14px}
.who button{min-height:38px;border-radius:8px;border:1px solid #3A342D;background:#2A2520;color:#fff;font-weight:600;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px max(24px,env(safe-area-inset-right,0px)) 14px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--display);font-size:25px;margin:0;font-weight:600}
.top .sub{color:var(--muted);font-size:14px}
.content{padding:22px 28px 40px;display:flex;flex-direction:column;gap:18px;max-width:1560px;width:100%}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card > h2{margin:0;padding:15px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .bd{padding:16px 20px}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.row > *{min-width:0}
.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:27px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--body)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14.5px;text-decoration:none;color:inherit}
.btn:hover:not(:disabled){border-color:#B9B0A2}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){background:#A2470C}
.btn.sea{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.big{min-height:64px;font-size:18px;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F0ECE4;vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-sea{background:var(--sea-soft);color:var(--sea)}.p-mute{background:#EEEAE2;color:var(--muted)}.p-acc{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid #CFC7B9;background:var(--panel);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.status{padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.inp{width:100%;min-height:44px;border:1px solid #CFC7B9;border-radius:9px;padding:0 12px;background:#fff}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
/* TPV */
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 rgba(26,23,20,.03)}
.board-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.board-h h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;background:var(--soft)}
.legend i{width:10px;height:10px;border-radius:50%}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.acard{position:relative;min-height:86px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;padding:10px 12px 10px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow:hidden;font-variant-numeric:tabular-nums}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--st)}
.acard .an{font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .ad{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ab{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.acard .am{font-family:var(--display);font-size:18px;font-weight:700;white-space:nowrap}
.acard .as{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--stbg);color:var(--stink);white-space:nowrap}
.acard.st-due{--st:#D13B30;--stbg:#FCE4E2;--stink:#A3231F;background:#FFF8F7}
.acard.st-part{--st:#E39A16;--stbg:#FDF0DD;--stink:#8A4B00;background:#FFFBF2}
.acard.st-paid{--st:#2E9E5B;--stbg:#E1F5EA;--stink:#0B5A3A;background:#F6FCF8}
.acard.st-empty{--st:#CFC7B9;--stbg:#EEEAE2;--stink:#5E5850}
.acard.st-quick{--st:var(--ink);--stbg:#EEEAE2;--stink:var(--ink);background:var(--ink);color:#fff;border-color:var(--ink)}
.acard.st-quick .ad{color:#C9C1B4}
.acard.on{outline:3px solid var(--accent);outline-offset:1px}
.acard.new{border-style:dashed;justify-content:center;align-items:center;color:var(--accent);font-weight:700;font-size:15px;background:transparent}
.acard.new::before{display:none}
.tpv2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat.fav{border-color:#E9B48F}.cat.fav.on{background:var(--accent);border-color:var(--accent)}
.cat{flex:none;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 16px 0 8px;border-radius:24px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14.5px}
.cat .cdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cat .cdot svg{width:24px;height:24px}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{border-radius:14px;border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;position:relative;transition:transform .08s,box-shadow .12s}
.tile:hover:not(:disabled){box-shadow:0 6px 18px rgba(26,23,20,.10)}
.tile:active:not(:disabled){transform:scale(.98)}
.tile .ph{height:128px;display:flex;align-items:center;justify-content:center;background:var(--tint)}
.tile .ph svg{height:118px;width:auto;max-width:100%}
.tile .tx{padding:9px 12px 11px;display:flex;flex-direction:column;gap:2px}
.tile .nm{font-size:14.5px;font-weight:700;line-height:1.2;min-height:2.4em}
.tile .pr{font-family:var(--display);font-size:18px;font-weight:600}
.tile .tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.95);color:var(--ink);border-radius:8px;padding:2px 7px}
.tile .cnt{position:absolute;top:8px;right:8px;min-width:28px;height:28px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.ticket{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;box-shadow:0 1px 0 rgba(26,23,20,.03)}
.tl{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #F0ECE4;font-variant-numeric:tabular-nums}
.tl .mini{width:38px;height:38px;border-radius:9px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:none}
.tl .mini svg{height:32px;width:auto}
.tl .q{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;flex:none}
.tl.paidline{opacity:.55}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px}
.total span{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.paidbanner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700}
/* conexión */
.netpill{min-height:38px;border-radius:19px;padding:0 14px;font-weight:700;font-size:13px;border:0}
.netpill.on{background:var(--ok-bg);color:var(--ok)}
.netpill.off{background:var(--bad-bg);color:var(--bad)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(26,23,20,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:#fff;border-radius:16px;width:min(720px,100%);max-height:100%;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-family:var(--display);font-size:24px}
.qr{width:150px;height:150px;display:grid;grid-template-columns:repeat(15,1fr);gap:0;border:8px solid #fff;outline:1px solid var(--line);flex:none}
.qr i{background:var(--ink)}
.qr i.w{background:#fff}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.part.paid{background:var(--ok-bg);border-color:#A7DDBF}
.drawerAnim{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--sea-soft);color:var(--sea);font-weight:700}
/* login */
.lock{position:fixed;inset:0;background:var(--side);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{background:#fff;border-radius:18px;padding:26px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.person{min-height:72px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.person small{font-weight:500;color:var(--muted);font-size:11.5px}
.person.on{border:2px solid var(--accent);background:var(--accent-soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-family:var(--display);font-size:24px;font-weight:600}
.dots{display:flex;justify-content:center;gap:12px;min-height:20px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
/* comandero */
.slip{width:280px;flex:none;background:#FFFEF8;border:1px solid #D9D4C3;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 0 #E7E1CD}
.slip h3{margin:0;font-size:18px;text-align:center}
/* gráficas */
.hours{display:grid;grid-template-columns:repeat(11,1fr);gap:8px;align-items:end;height:200px;padding-top:10px}
.hours .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hours .b{width:100%;border-radius:6px 6px 0 0;background:#E7B48D}
.hours .b.max{background:var(--accent)}
.hours span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hours em{font-style:normal;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.phone{width:340px;max-width:100%;height:640px;border-radius:34px;border:9px solid #1A1714;background:var(--soft);overflow:hidden;display:flex;flex-direction:column;flex:none}
.phone .pt{background:#1A1714;color:#fff;padding:12px 16px;font-weight:700;font-family:var(--display)}
.phone .pb{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.shot{border:2px dashed #CFC7B9;border-radius:12px;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;padding:10px;overflow:hidden}
.shot img{max-width:100%;max-height:260px;border-radius:8px}
.cnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.cnt label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;padding:8px;border:1px solid var(--line);border-radius:10px}
.cnt input{min-height:38px;border:1px solid #CFC7B9;border-radius:8px;padding:0 8px;font-size:16px;width:100%}
@media (max-width:1180px){.tpv2{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px))}
  .sede,.grp,.who{display:none}
  .nav{display:flex;gap:4px}.nav a{white-space:nowrap}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tpv2{grid-template-columns:1fr}.ticket{position:static}
}

/* 18 nov 2026: categorías como pestañas sobrias y cuentas compactas (el dueño quiere verlas todas; al tocar una se abre en el ticket) */
.cats{gap:6px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:12px}
.cat{min-height:40px;padding:0 14px;border-radius:8px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--muted);gap:0;position:relative}
.cat .cdot{display:none}
.cat:hover{background:var(--soft);color:var(--ink)}
.cat.on{background:var(--ink);color:#fff}
.cat.fav{border:0;color:var(--accent)}.cat.fav.on{background:var(--accent);color:#fff}
.accgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.acard{min-height:52px;padding:6px 8px 6px 12px;gap:2px;border-radius:9px}
.acard::before{width:5px}
.acard .an{font-size:13.5px}
.acard .ad{display:none}
.acard .ab{gap:4px}
.acard .am{font-size:15px}
.acard .as{display:none}
.acard.st-quick .as{display:none}
.acard.new{min-height:52px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 19 nov 2026 (dueño): categorías como botones con el dibujo de un producto del grupo */
.tpv2 .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;padding:0;background:transparent;border:0;border-radius:0}
.cats .cat{min-height:0;padding:8px 6px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:700;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;box-shadow:0 1px 2px rgba(26,23,20,.05)}
.cats .cat .cdot{display:flex;width:52px;height:52px;border-radius:14px;overflow:hidden;align-items:center;justify-content:center;flex:none}
.cats .cat .cdot svg,.cats .cat .cdot img{width:46px;height:46px}
.cats .cat:hover{background:#fff;border-color:#BDB4AA;color:var(--ink)}
.cats .cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cats .cat.on .cdot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.cats .cat.fav{border:1px solid #E9B48F;color:var(--accent)}
.cats .cat.fav .cdot{font-size:28px!important}
.cats .cat.fav.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>

const TIPOS={alquiler:['1 hora de alquiler de cualquier material','En cualquiera de las 3 escuelas','OHK'],bebida:['1 bebida gratis (refresco o cerveza)','En el kiosko','OHK'],combinado:['1 combinado gratis','En el kiosko','OHK'],importe:['','En el kiosko','OHK']};

A.promos=()=>{
  $$('[data-pt]').forEach(b=>b.onclick=()=>{promoTab=b.dataset.pt;promoMsg='';render()});

function current(){const h=location.hash.slice(1);return PAGES.find(p=>p.id===h)||PAGES[0]}
const isAdm=()=>user&&user.rol==='admin';
function nav(){
  const c=current();let g='';
  $('#nav').innerHTML=PAGES.map(p=>{const head=p.g!==g?`<div class="grp">${p.g}${p.adm?' · solo Isidro':''}</div>`:'';g=p.g;const lk=p.adm&&!isAdm();
   const badge=p.id==='pedidos'?pedCount():p.id==='comandas'?COMANDAS.filter(x=>!x.done).length:0;
   return head+`<a href="#${p.id}" class="${p.id===c.id?'on':''} ${lk?'locked':''}" ${p.id===c.id?'aria-current="page"':''}><svg class="ni" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAVI[p.id]||''}</svg>${p.t}${lk?' 🔒':''}${badge?`<span class="badge">${badge}</span>`:''}</a>`}).join('');
  $('#who').innerHTML=user?`<div>Dentro: <b>${user.nm}</b><br>${user.rol==='admin'?'Administrador':'Trabajador'} · ${fichado(user.id)?'fichado '+hhmm(fichado(user.id).in):'sin fichar'}</div><button id="salir">Cambiar de persona</button>`:'';
  if($('#salir'))$('#salir').onclick=()=>{user=null;showLock()};
}
function render(){
  const p=current();nav();drawNet();$('#ttl').textContent=p.t;$('#sub').textContent=p.s;$('#clock').textContent=hhmm();
  if(p.adm&&!isAdm()){$('#view').innerHTML=`<div class="card"><div class="bd" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><h2 style="margin:0;font-size:20px">Solo para el administrador</h2><p class="muted" style="margin:0">Esta parte la ve Isidro. Los trabajadores pueden vender, hacer comandas, cerrar caja, ver faltas y pedidos, subir facturas y fichar.</p><button class="btn pri" id="asadm">Entrar como Isidro</button></div></div>`;$('#asadm').onclick=()=>{pickPerson='isidro';user=null;showLock()};return}
  $('#view').innerHTML=V[p.id]();A[p.id]&&A[p.id]();
}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});

document.addEventListener('keydown',e=>{if(!$('#lock').hidden&&/^[0-9]$/.test(e.key)){const b=$(`#lock [data-k="${e.key}"]`);b&&b.click()}if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- 1. Vender (TPV) ---------- */
const accGross=a=>Object.keys((ACC[a]||{}).items||{}).reduce((s,k)=>s+(prod(k)?prod(k).p:0)*ACC[a].items[k],0);
const accTotal=a=>{const x=ACC[a],g=accGross(a);const pc=x.pct?g*x.pct.val/100:0;const d=(x.descs||[]).reduce((s,y)=>s+y.amt,0);return Math.max(0,Math.round((g-pc-d)*100)/100)};
function accState(n){if(n===QUICK)return 'quick';if(!ACC[n])return 'empty';const t=accTotal(n),p=t-ACC[n].paid;if(t<=0)return 'empty';if(p<=0.005)return 'paid';return ACC[n].paid>0?'part':'due'}
const ago=t=>{const m=Math.round((Date.now()-t)/60e3);return m<60?`hace ${m} min`:`hace ${Math.floor(m/60)} h ${m%60?m%60+' min':''}`.trim()};
function boardHTML(){
  const names=ACCS.filter(x=>x!==QUICK&&!ACC[x].hidden);
  const due=names.filter(n=>['due','part'].includes(accState(n))),paid=names.filter(n=>accState(n)==='paid'),empty=names.filter(n=>accState(n)==='empty');
  const pendTot=due.reduce((s,n)=>s+accTotal(n)-ACC[n].paid,0);
  const order=[...due.sort((a,b)=>ACC[a].opened-ACC[b].opened),...empty,...paid.sort((a,b)=>(ACC[b].paidAt||0)-(ACC[a].paidAt||0))];
  const shown=order.filter(n=>accFilter==='todas'||(accFilter==='pend'&&due.includes(n))||(accFilter==='paid'&&paid.includes(n)));

function qrGrid(seed){let s=seed*7+3;const cells=[];for(let i=0;i<225;i++){const r=Math.floor(i/15),c=i%15;const finder=(r<5&&c<5)||(r<5&&c>9)||(r>9&&c<5);let on;if(finder){const rr=r>9?r-10:r,cc=c>9?c-10:c;on=rr===0||rr===4||cc===0||cc===4||(rr===2&&cc===2)}else{s=(s*9301+49297)%233280;on=s/233280<.5}cells.push(`<i class="${on?'':'w'}"></i>`)}return `<div class="qr" aria-label="Código QR de ejemplo" role="img">${cells.join('')}</div>`}

  $('#modal').hidden=false;$('#modal').onclick=e=>{if(e.target===$('#modal')){closeModal();render()}};draw();

A.cierre=()=>{

  if($('#delpend'))$('#delpend').onclick=()=>{const b=$('#delpend');if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='Pulsa otra vez: se borran todas las cuentas sin cobrar';return}
    ACCS.filter(n=>n!==QUICK&&ACC[n]&&['due','part'].includes(accState(n))).forEach(n=>{ACCS=ACCS.filter(x=>x!==n);delete ACC[n]});

  const upd=()=>{const c=contadoCaja();$('#contado').textContent=isNaN(c)?'—':eur(c);if(isNaN(c)){$('#desc').innerHTML='';return}const d=r2(c-(CAJA.fondo+ef));$('#desc').innerHTML=Math.abs(d)<.005?'<div class="status">Cuadra.</div>':`<div class="note">${d>0?'Sobran':'Faltan'} ${eur(Math.abs(d))}. Puedes cerrar igualmente y explicarlo en las notas.</div>`};

function textoTicket(t){const L=[];
  L.push(centro(PRN.nombre));if(PRN.nif)L.push(centro('NIF '+PRN.nif));if(PRN.dir)L.push(centro(PRN.dir));

  L.push('-'.repeat(PRN.col));
  t.l.forEach(([n,nm,imp])=>L.push(lineaLR(n+' x '+nm,eur(imp))));
  L.push('-'.repeat(PRN.col));L.push(lineaLR('TOTAL',eur(t.tot)));
  L.push(lineaLR('IVA incluido (10%)',eur(t.tot-t.tot/1.10)));
  L.push(lineaLR('Pago',t.how));if(t.who)L.push(lineaLR('Le atendio',t.who));

  enviar(ESC.ini+ESC.grande+plano('COMANDA '+c.n+'  '+hhmm(c.t))+'\n'+ESC.normal+'\x1d!\x01'+L.slice(1).join('\n')+ESC.normal+ESC.corte)}

/* ---------- Fichajes en la web (dueño, 18 nov 2026: los camareros fichan solo aquí, en el kiosko, no con el móvil) ----------
   El aparato se conecta una vez con la contraseña de la gestión de la escuela y recibe un código propio (nunca en el código: este

   se fichó. La lista de camareros, sus horas ordinarias, el registro de jornada y la firma del mes viven en la web (api/monitores.js, kio_*). */
const WEBAPI='https://ohanasurf3piedras.com/api/monitores/', WK='ohk-web', COLA='ohk-cola', EQK='ohk-equipo';

let WEB=lsJ(WK,null);

async function web(cuerpo){const r=await fetch(WEBAPI,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},cuerpo,{tok:WEB&&WEB.tok}))});
  const j=await r.json().catch(()=>({error:'Sin conexión con la web.'}));if(!r.ok){const e=new Error(j.error||('Error '+r.status));e.status=r.status;throw e}return j}
function encola(id,tipo,t){if(!esWeb(id))return;const c=lsJ(COLA,[]);c.push({cid:Date.now().toString(36)+Math.random().toString(36).slice(2,8),id,tipo,t});lsS(COLA,c);envia()}

    catch(e){if(!e.status||e.status>=500||e.status===401||e.status===429)break;const er=lsJ('ohk-cola-err',[]);er.push(Object.assign({error:e.message},c[0]));lsS('ohk-cola-err',er)}
    c=lsJ(COLA,[]);c.shift();lsS(COLA,c)}}finally{enviando=false}}
function aplicaEquipo(lst){if(!Array.isArray(lst))return;const adm=STAFF.filter(s=>s.rol==='admin');
  STAFF.splice(0,STAFF.length,...adm,...lst.map(x=>({id:x.id,nm:x.n,rol:'trabajador',puesto:'Camarero',eh:0,ord:x.ord,semanaMin:x.semanaMin||0,extraMin:x.extraMin||0,web:true})));

/* ---------- Escáner del TPV (lector 1D/2D integrado, dueño 19 nov 2026) ----------
   El lector «escribe» el código como un teclado muy rápido y acaba con Intro. Se distingue de una persona por la velocidad.
   · Código de un producto (Productos y aparatos › Código de barras) → se suma a la cuenta abierta.
   · Código de un vale o promoción → abre «Canjear vale o código» con el código puesto.
   · En Productos y aparatos, tras pulsar «Escanear» en un producto, el siguiente código se le asigna. */
let ESPERA_BC=null, scBuf='', scT=0;
addEventListener('keydown',e=>{const t=e.target,campo=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');const ahora=Date.now();
  if(ahora-scT>80)scBuf='';scT=ahora;
  if(e.key==='Enter'){const c=scBuf.trim();scBuf='';if(c.length>=4&&!campo){e.preventDefault();escaneado(c)}else if(c.length>=4&&campo&&t.id!=='cc'){e.preventDefault();if(t.value.endsWith(c))t.value=t.value.slice(0,-c.length);escaneado(c)}return}
  if(e.key.length===1)scBuf+=e.key},true);
function escaneado(code){const C=code.toUpperCase();
  if(ESPERA_BC){const m=prod(ESPERA_BC);ESPERA_BC=null;const otro=MENU.find(x=>x.bc===code&&x!==m);if(otro)otro.bc=null;if(m){m.bc=code}guardar();render();return}
  const m=MENU.find(x=>x.bc===code);
  if(m&&user){if(current().id!=='tpv')location.hash='tpv';const it=ACC[cur].items;it[m.id]=(it[m.id]||0)+1;tpvMsg='Escaneado: '+m.nm;render();return}
  if(user&&(VALES.some(v=>v.code===C)||PROMOS.some(p=>p.code===C))){if(current().id!=='tpv')location.hash='tpv';setTimeout(()=>{canjeModal();const i=$('#cc');if(i){i.value=C;const b=$('#ccok');if(b)b.click()}},150);return}
  if(user){tpvMsg='Código '+code+' sin producto. Asígnalo en «Productos y aparatos» › Código de barras.';if(current().id==='tpv')render()}}
/* Quitar productos de la carta (dueño, 18 nov 2026). Los de la carta base se recuerdan en BORRADOS; los añadidos a mano se quitan sin más. */
let BORRADOS=[];
function quitarProducto(id){const i=MENU.findIndex(x=>x.id===id);if(i<0)return;MENU.splice(i,1);if(!/^x/.test(id)&&BORRADOS.indexOf(id)<0)BORRADOS.push(id);
  MENU.filter(x=>x.opts).forEach(x=>{x.opts=x.opts.filter(o=>o[0]!==id);if(!x.opts.length)quitarProducto(x.id);else x.p=Math.min(...x.opts.map(o=>prod(o[0]).p))})}
/* ---------- Guardar en este aparato (hasta tener la base de datos del kiosko) ---------- */
const SK='ohk-estado-v1', hoyK=()=>new Date().toLocaleDateString('sv-SE');
function guardar(){try{localStorage.setItem(SK,JSON.stringify({dia:hoyK(),ACCS,ACC,COMANDAS,nextCom,nextTicket,SALES,COBROS,cierreHecho,CAJA,cierreRes,HIST,FICHAJES,FALTAS,STOCK,ULTIMO,CLIENTES,VALES,PROMOS,FREC,FEMI,RULES,MENU:MENU.map(m=>({id:m.id,p:m.p,foto:m.foto||null,bc:m.bc||null})),BORRADOS,EXTRA:MENU.filter(m=>/^x/.test(m.id)).map(m=>({id:m.id,c:m.c,nm:m.nm,p:m.p,r:m.r,k:m.k,foto:m.foto||null,bc:m.bc||null}))}))}catch(e){console.warn('No se pudo guardar',e)}}
function cargar(){let d;try{d=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}if(!d)return;
  ACCS=d.ACCS||ACCS;ACC=d.ACC||ACC;COMANDAS=d.COMANDAS||[];nextCom=d.nextCom||1;nextTicket=d.nextTicket||1;
  HIST.splice(0,HIST.length,...(d.HIST||[]));FICHAJES=d.FICHAJES||[];ULTIMO=d.dia===hoyK()?d.ULTIMO||null:null;FALTAS=d.FALTAS||[];CLIENTES=d.CLIENTES||[];VALES=d.VALES||[];PROMOS=d.PROMOS||[];FREC=d.FREC||[];FEMI=d.FEMI||[];RULES=d.RULES||RULES;
  if(d.STOCK)Object.keys(d.STOCK).forEach(k=>{if(STOCK[k])Object.assign(STOCK[k],d.STOCK[k]);else if(/^x/.test(k))STOCK[k]=d.STOCK[k]});
  (d.EXTRA||[]).forEach(x=>{if(!prod(x.id))MENU.push(x)});(d.BORRADOS||[]).forEach(quitarProducto);
  (d.MENU||[]).forEach(x=>{const m=prod(x.id);if(m){m.p=x.p;if(x.foto)m.foto=x.foto;if(x.bc)m.bc=x.bc}});
  CAJA=d.CAJA||null;cierreRes=d.cierreRes||null;
  if(d.dia===hoyK()||(d.CAJA&&d.CAJA.abierta)){SALES=d.SALES||[];COBROS=d.COBROS||[];cierreHecho=false;if(!CAJA&&COBROS.length)CAJA={abierta:true,desde:COBROS[0].t||Date.now(),fondo:0,por:'—',auto:true}}
  else{SALES=[];COBROS=[];cierreHecho=false;ACCS.forEach(n=>{const a=ACC[n];if(a&&a.paid&&a.paidAt)a.hidden=true})}}
cargar();try{sanea()}catch(e){}
aplicaEquipo(lsJ(EQK,null));
addEventListener('online',()=>{envia();refrescaEquipo()});
setInterval(()=>{envia();refrescaEquipo()},120000);
setTimeout(()=>{envia();refrescaEquipo()},1500);
/* Dueño, 20 nov 2026: si algo falla al pintar, no se bloquea todo: se arreglan los datos raros y sale un aviso rojo abajo. */
function sanea(){
  if(!Array.isArray(ACCS))ACCS=[QUICK];if(!ACC||typeof ACC!=='object')ACC={};
  ACCS=[...new Set(ACCS)].filter(n=>n===QUICK||(ACC[n]&&typeof ACC[n]==='object'));if(!ACCS.includes(QUICK))ACCS.unshift(QUICK);
  if(!ACC[QUICK])ACC[QUICK]={items:{},paid:0,parts:[],donde:'',opened:Date.now(),billed:{},hidden:false};
  Object.keys(ACC).forEach(n=>{const a=ACC[n];if(!a||typeof a!=='object'){delete ACC[n];return}a.items=a.items||{};a.billed=a.billed||{};a.parts=a.parts||[];a.paid=+a.paid||0;
    Object.keys(a.items).forEach(k=>{if(!prod(k)||!(a.items[k]>0)){delete a.items[k];delete a.billed[k]}})});
  if(!ACC[cur])cur=QUICK;
}
function avisoError(e){let b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:10000;background:#A3231F;color:#fff;padding:10px 16px;font:14px/1.4 system-ui;display:flex;gap:10px;align-items:center;flex-wrap:wrap';document.body.appendChild(b)}
  b.innerHTML='<b>Algo ha fallado:</b> <span style="flex:1;min-width:200px">'+esc(String(e&&e.message||e))+' (haz una foto y mándasela a Claude)</span><button id="errfix" style="background:#fff;color:#A3231F;border:0;border-radius:8px;padding:8px 12px;font-weight:700">Arreglar y seguir</button>';
  document.getElementById('errfix').onclick=()=>{try{sanea();guardar()}catch(x){}b.remove();try{_render()}catch(x){avisoError(x)}}}
addEventListener('error',ev=>avisoError(ev.error||ev.message));
const _render=render;render=function(){try{_render()}catch(e){console.error(e);try{sanea();_render()}catch(e2){avisoError(e2)}}guardar()};
addEventListener('pagehide',guardar);
nav();render();showLock();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
