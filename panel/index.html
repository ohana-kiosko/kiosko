<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel del kiosko</title>
<meta name="theme-color" content="#1A1714">
<link rel="manifest" href="/panel/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Panel del dueño (21 nov 2026): se mira en el móvil. Mismos colores que el TPV: arena clara, tinta oscura, naranja atardecer. */
:root{
  --bg:#F1EFEA; --panel:#FFFFFF; --ink:#1A1714; --muted:#5E5850; --line:#E2DDD3; --soft:#F8F6F1;
  --accent:#C2560F; --accent-soft:#FBE7D6; --sea:#0B6670;
  --warn:#8A4B00; --warn-bg:#FDF0DD; --bad:#A3231F; --bad-bg:#FCE4E2; --ok:#0B5A3A; --ok-bg:#E1F5EA;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --body:Inter,ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#F4EFE9;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;flex:1}
.top small{display:block;font:12px var(--body);color:#BDB4AA;letter-spacing:0}
.ib{border:1px solid #4A433C;background:transparent;color:#F4EFE9;border-radius:10px;padding:8px 10px;min-height:40px}
main{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:16px;margin-bottom:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:600 20px var(--display);font-variant-numeric:tabular-nums}
.kpi.big{background:var(--accent-soft)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.bad{color:var(--bad);border-color:#E9A6A2}
.btn:disabled{opacity:.5}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mute{background:var(--soft);color:var(--muted)}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:10px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.it:first-child{border-top:0}
.it .t{font-weight:600}
.it .s{font-size:13px;color:var(--muted)}
.it .n{font:600 16px var(--display);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.day{font:600 13px var(--body);color:var(--muted);margin:6px 2px 0}
.nav{display:flex;align-items:center;gap:8px}
.nav b{flex:1;text-align:center;font-family:var(--display);font-size:16px}
.nav .btn{min-width:48px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-height:60px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff;font-size:16px;color:var(--ink);width:100%}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(26,23,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:18px;flex:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
.kv .big{font-size:18px;color:var(--accent)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;z-index:30;font-size:14px;max-width:90vw}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1F9D5A;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(31,157,90,.5);animation:late 2s infinite}
.dot.off{background:#B9B1A6;animation:none}
@keyframes late{0%{box-shadow:0 0 0 0 rgba(31,157,90,.5)}70%{box-shadow:0 0 0 8px rgba(31,157,90,0)}100%{box-shadow:0 0 0 0 rgba(31,157,90,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.graf{display:block;margin-top:6px;touch-action:manipulation}
.cap{font-size:13px;color:var(--muted);min-height:36px;margin-top:4px}.cap b{color:var(--ink)}
.ley{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}.ley i,.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.hb:first-of-type{border-top:0}
.hb .hn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .hs{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.hb .bar{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.hb .bar i{display:block;height:100%;border-radius:4px}
.split{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}.split i{display:block;min-width:2px}
.msg{margin:6px 0 0;white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;font:14px var(--body)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}a.btn.pri{color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* Panel del dueño (21 nov 2026). Lee lo que sube la tablet (cajas y fichajes) y guarda la configuración de los camareros:
   horas ordinarias por semana y € por hora extra. Las semanas van de lunes a domingo; lo que pase de las ordinarias es extra.
   Cada semana cuenta en el mes en que cae su domingo. Solo cuentan los fichajes cerrados (con salida). */
const API='/api/panel', TK='ohp-tok';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const r2=n=>Math.round((+n||0)*100)/100;
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ymd=t=>new Date(t).toLocaleDateString('sv-SE');
const hTxt=m=>{m=Math.round(m||0);const h=Math.floor(m/60),mm=m%60;return h+' h'+(mm?' '+String(mm).padStart(2,'0'):'')};
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsP=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function lunesDe(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(x)}
function masDias(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x)}
const may=t=>t.charAt(0).toUpperCase()+t.slice(1);
const diaTxt=d=>may(new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
const diaCorto=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
const mesTxt=m=>may(new Date(m+'-15T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'}));
const mesMas=(m,n)=>{const x=new Date(m+'-15T12:00:00');x.setMonth(x.getMonth()+n);return ymd(x).slice(0,7)};
const semTxt=l=>{const a=new Date(l+'T12:00:00'),b=new Date(masDias(l,6)+'T12:00:00');return a.getDate()+(a.getMonth()!==b.getMonth()?' '+a.toLocaleDateString('es-ES',{month:'short'}):'')+' – '+b.getDate()+' '+b.toLocaleDateString('es-ES',{month:'short'})};
const hace=t=>{if(!t)return 'nunca';const m=Math.round((Date.now()-t)/60000);if(m<1)return 'ahora mismo';if(m<60)return 'hace '+m+' min';const h=Math.round(m/60);if(h<24)return 'hace '+h+' h';return 'el '+new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' a las '+hhmm(t)};

let TOK=lsG(TK), EST=null, CFG=null, TAB=lsG('ohp-tab')||'directo', MES=ymd(Date.now()).slice(0,7), SEM=lunesDe(ymd(Date.now())), cargando=false, error='';

async function api(metodo,a,cuerpo){
  const r=await fetch(API+(metodo==='GET'?'?a='+a:''),{method:metodo,headers:Object.assign({'Content-Type':'application/json'},TOK?{'x-tok':TOK}:{}),body:metodo==='POST'?JSON.stringify(Object.assign({a},cuerpo)):undefined});
  const j=await r.json().catch(()=>({error:'Sin conexión'}));
  if(r.status===401&&a!=='entrar'){TOK=null;lsP(TK,null)}
  if(!r.ok)throw new Error(j.error||('Error '+r.status));return j}
function toast(t){const o=document.createElement('div');o.className='toast';o.setAttribute('role','status');o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),2600)}

/* ---------- Datos ---------- */
function config(){const c=CFG||{};c.camareros=Array.isArray(c.camareros)?c.camareros:[];c.extra=c.extra==null?10:+c.extra;c.fix=c.fix&&typeof c.fix==='object'?c.fix:{};c.nuevos=Array.isArray(c.nuevos)?c.nuevos:[];c.valida=c.valida&&typeof c.valida==='object'?c.valida:{};c.alias=c.alias&&typeof c.alias==='object'?c.alias:{};c.pagado=c.pagado&&typeof c.pagado==='object'?c.pagado:{};
  // La primera vez, los camareros salen de los que conoce la tablet.
  if(!c.camareros.length&&EST&&Array.isArray(EST.staff))c.camareros=EST.staff.map(s=>({id:s.id,nm:s.nm,activo:true,ord:[{desde:'2000-01-03',h:s.ord>0?+s.ord:20}]})),c.sinGuardar=true;
  CFG=c;return c}
const cams=()=>config().camareros;
const camDe=id=>cams().find(x=>x.id===id);
const nombre=id=>{const c=camDe(id);if(c)return c.nm;const s=EST&&EST.staff&&EST.staff.find(x=>x.id===id);return s?s.nm:may(String(id||''))};
function ordDe(c,lunes){const v=((c&&c.ord)||[]).filter(o=>o.desde<=lunes).sort((a,b)=>a.desde<b.desde?-1:1).pop();return v?+v.h:20}
const clave=f=>f.p+'|'+f.in;
/* Horas cambiadas en la tablet por olvido (23 nov 2026). f.in/f.out son la hora real en que se pulsó; f.cam.in/out la que dice la
   persona ({t, por, nota, st:'pend'|'ok'|'no', val}). El dueño valida o rechaza aquí: config.valida[p|in|campo] = {st, por, at}. */
const kCam=(f,cp)=>f.p+'|'+f.in+'|'+cp;
function camP(f,cp){const x=f.cam&&f.cam[cp];if(!x)return null;const v=config().valida[kCam(f,cp)];if(v&&(!x.val||v.at>x.val.at))return Object.assign({},x,{st:v.st,val:{por:v.por,at:v.at}});return x}
function efP(f){const r=Object.assign({},f);['in','out'].forEach(cp=>{const x=camP(f,cp);if(x&&x.st!=='no'&&(cp==='in'||f.out))r[cp]=x.t});r.cams=[camP(f,'in'),camP(f,'out')].filter(Boolean);return r}
function pendientes(){const o=[];((EST&&EST.fichajes)||[]).forEach(f=>['in','out'].forEach(cp=>{const x=camP(f,cp);const fx=config().fix[clave(f)];if(x&&x.st==='pend'&&!(fx&&(fx.x||(fx.at||0)>=(x.at||0))))o.push({f,cp,x,k:kCam(f,cp)})}));return o.sort((a,b)=>b.x.t-a.x.t)}
const camTxt=f=>!f.cams||!f.cams.length?'':f.cams.some(x=>x.st==='pend')?' · por validar':f.cams.some(x=>x.st==='no')?' · cambio rechazado':' · hora cambiada';
/* Fichajes con las correcciones del dueño aplicadas. */
function fichajes(){const c=config();const out=[];
  ((EST&&EST.fichajes)||[]).forEach(f=>{const x=c.fix[clave(f)];if(x&&x.x)return;const e=efP(f);
    if(x)['in','out'].forEach(cp=>{if(!(cp in x))return;const ce=f.cam&&f.cam[cp];if((x.at||0)>=(ce?ce.at||0:0))e[cp]=x[cp]});if(e.mano){e.aMano=1;delete e.mano}const al=c.alias[e.p];if(al==='-')return;if(al){e.orig=e.p;e.p=al}out.push(Object.assign(e,{k:clave(f),corr:!!x}))});
  c.nuevos.forEach(n=>out.push(Object.assign({},n,{k:'n|'+n.id,mano:true})));
  return out.filter(f=>f.in).sort((a,b)=>a.in-b.in)}
const minDe=f=>f.out&&f.out>f.in?Math.round((f.out-f.in)/60000):0;
function semana(id,lunes,F){const fin=masDias(lunes,6);return (F||fichajes()).filter(f=>f.p===id&&ymd(f.in)>=lunes&&ymd(f.in)<=fin).reduce((a,f)=>a+minDe(f),0)}
function resumenMes(id,mes,F){F=F||fichajes();const c=camDe(id);const sems=[];let l=lunesDe(mes+'-01');
  const hoy=ymd(Date.now());while(masDias(l,6).slice(0,7)<=mes&&l<=hoy){if(masDias(l,6).slice(0,7)===mes){const m=semana(id,l,F),o=ordDe(c,l)*60;sems.push({lunes:l,min:m,ord:o,extra:Math.max(0,m-o),cerrada:masDias(l,6)<ymd(Date.now())})}l=masDias(l,7)}
  const extra=sems.reduce((a,s)=>a+s.extra,0),tot=sems.reduce((a,s)=>a+s.min,0);return {sems,extra,tot,eur:r2(extra/60*config().extra)}}
const dentro=(id,F)=>(F||fichajes()).filter(f=>f.p===id&&!f.out).pop();

async function carga(){if(cargando)return;cargando=true;error='';pinta();
  try{const r=await api('GET','todo');EST=r.estado;CFG=r.config||{};VIVO=r.vivo||null;const m=r.modo||'blob';if(m!==MODO){MODO=m;relojVivo()}}catch(e){error=e.message}
  cargando=false;pinta()}
async function guardaCfg(msg){const c=config();const copia=Object.assign({},c);delete copia.sinGuardar;
  try{const r=await api('POST','config',{config:copia});c.t=r.t;delete c.sinGuardar;toast(msg||'Guardado. La tablet lo recoge en unos minutos.')}catch(e){toast('No se pudo guardar: '+e.message)}pinta()}

/* ---------- Pantallas ---------- */
const ICO={directo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
 pedidos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v14H5V6h3z"/><path d="M9 11h6M9 15h4"/></svg>',
 cajas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M3 11h18M7 15h3"/><path d="M8 7V5h8v2"/></svg>',
 camareros:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
 ajustes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'};
const NOMBRES={directo:'En directo',cajas:'Cajas',pedidos:'Pedidos',camareros:'Camareros',ajustes:'Ajustes'};
const VISTAS={directo:[()=>vDirecto(),()=>aDirecto()],cajas:[()=>vCajas(),()=>aCajas()],pedidos:[()=>vPedidos(),()=>aPedidos()],camareros:[()=>vCamareros(),()=>aCamareros()],ajustes:[()=>vAjustes(),()=>aAjustes()]};
if(!NOMBRES[TAB])TAB='directo';
function pinta(){
  const app=$('#app');
  if(!TOK){app.innerHTML=`<div class="login"><form class="card" id="lf"><h1 style="font-size:22px">Panel del kiosko</h1><p class="muted" style="margin:0">Cajas y horas de los camareros. Entra con la clave larga del TPV (la que pusiste en Vercel como TPV_CLAVE).</p>
    <label class="f">Clave del TPV<input class="inp" id="lc" type="password" autocomplete="current-password" required></label><button class="btn pri" id="lb">Entrar</button><div id="lm" role="alert"></div></form></div>`;
    $('#lf').onsubmit=async e=>{e.preventDefault();$('#lb').disabled=true;$('#lm').innerHTML='';try{const r=await api('POST','entrar',{clave:$('#lc').value,quien:'dueno'});TOK=r.tok;lsP(TK,TOK);carga()}catch(er){$('#lm').innerHTML='<div class="err">'+esc(er.message)+'</div>';$('#lb').disabled=false}};return}
  const ult=Math.max((VIVO&&(VIVO.recibido||VIVO.t))||0,(EST&&(EST.recibido||EST.t))||0);const sub=ult?'La tablet mandó datos '+hace(ult):(cargando?'Cargando…':'La tablet aún no ha mandado datos');
  app.innerHTML=`<header class="top"><h1>Kiosko · ${NOMBRES[TAB]}<small>${esc(sub)}</small></h1><button class="ib" id="rf" aria-label="Actualizar">${cargando?'…':'Actualizar'}</button></header>
  <main id="m">${error?`<div class="err">${esc(error)}</div>`:''}${!EST&&!cargando?`<div class="note">La tablet todavía no está conectada con este panel. En la tablet: menú «Equipo y sueldos» › «Conectar con el panel del móvil» y escribe la misma clave del TPV.</div>`:''}${VISTAS[TAB][0]()}</main>
  <nav class="tabs" aria-label="Secciones">${Object.entries(NOMBRES).map(([k,t])=>`<button data-tab="${k}" ${TAB===k?'aria-current="page"':''}>${ICO[k]}<span>${t}</span></button>`).join('')}</nav>`;
  $('#rf').onclick=carga;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;lsP('ohp-tab',TAB);pinta();scrollTo(0,0);if(['directo','pedidos'].includes(TAB))leeVivo()});
  VISTAS[TAB][1]();
}

/* Cajas */
const cierres=()=>((EST&&EST.cierres)||[]).filter(c=>c&&c.hasta);
/* Día de una caja = el día en que se ABRIÓ (dueño, 23 nov 2026: «el domingo no hizo caja y el lunes sí; hoy estoy cerrado»). Una caja
   que se cierra pasada la medianoche o al día siguiente cuenta en el día en que se trabajó. */
const diaC=c=>ymd(c.desde||c.hasta);
const cierreTxt=c=>{const a=ymd(c.desde||c.hasta),b=ymd(c.hasta);return a===b?hhmm(c.hasta):diaCorto(b)+' a las '+hhmm(c.hasta)};
/* Personal frente a ventas (dueño, 23 nov 2026: «cuánto dinero estoy gastando en personal con respecto a las cajas diarias, por días,
   semanas, meses y años»). Ventas = cierres de caja (más lo cobrado hoy si la caja está abierta). Personal = horas fichadas: las
   coste empresa de la nómina repartido por días (o las ordinarias a lo que vale la hora extra si no se ha puesto) y las extra
   a lo que se paga la hora extra, sin seguridad social. */
let PPER=lsG('ohp-pper')||'dia';
function personalVsVentas(){const c=config(),V={},P={};
  cierres().forEach(x=>{const d=diaC(x);V[d]=(V[d]||0)+(+x.ventas||0)});
  if(VIVO&&VIVO.caja&&VIVO.caja.abierta){const d=ymd(Date.now());V[d]=(V[d]||0)+(VIVO.cobros||[]).reduce((a,x)=>a+x.amt,0)}
  const hoy=ymd(Date.now()),dm=d=>new Date(+d.slice(0,4),+d.slice(5,7),0).getDate();
  const ids=[...new Set(fichajes().map(f=>f.p))];ids.forEach(id=>{const x=camDe(id),R=reparto(id),F=fichajes().filter(f=>f.p===id&&f.out);if(!F.length)return;
    // Sueldo fijo (coste empresa de la nómina) repartido entre los días del mes, desde su primer fichaje; si no hay nómina puesta, las ordinarias a lo que vale la hora extra.
    if(x&&x.cmes){for(let d=ymd(Math.min(...F.map(f=>f.in)));d<=hoy;d=masDias(d,1))P[d]=(P[d]||0)+x.cmes/dm(d)}
    F.forEach(f=>{const r=R[f.k];if(!r)return;const d=ymd(f.in);P[d]=(P[d]||0)+r.e/60*c.extra+(x&&x.cmes?0:r.o/60*c.extra)})});
  return {V,P}}
function vPersonal(){const {V,P}=personalVsVentas();const dias=[...new Set([...Object.keys(V),...Object.keys(P)])].sort();if(!dias.length)return '';
  const clave={dia:d=>d,sem:d=>lunesDe(d),mes:d=>d.slice(0,7),ano:d=>d.slice(0,4)}[PPER];const G={};
  dias.forEach(d=>{const k=clave(d);const g=G[k]||(G[k]={v:0,p:0});g.v+=V[d]||0;g.p+=P[d]||0});
  const ks=Object.keys(G).sort().reverse().slice(0,PPER==='dia'?31:PPER==='sem'?16:PPER==='mes'?12:10);
  const et=k=>PPER==='dia'?diaCorto(k):PPER==='sem'?'Sem. '+semTxt(k):PPER==='mes'?mesTxt(k):k;
  const tv=ks.reduce((a,k)=>a+G[k].v,0),tp=ks.reduce((a,k)=>a+G[k].p,0),pc=v=>v>0?Math.round(tp/tv*100):0;
  const col=q=>q>40?'#A3231F':q>30?'#C9601A':'#1F9D5A';
  return `<section class="card"><h2>Personal frente a ventas</h2>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${[['dia','Días'],['sem','Semanas'],['mes','Meses'],['ano','Años']].map(([k,t])=>`<button class="btn sm ${PPER===k?'pri':''}" data-pper="${k}">${t}</button>`).join('')}</div>
   <div class="kpis"><div class="kpi"><div class="l">Ventas</div><div class="v">${eur(r2(tv))}</div></div><div class="kpi"><div class="l">Personal</div><div class="v">${eur(r2(tp))}</div></div><div class="kpi"><div class="l">Personal / ventas</div><div class="v" style="color:${col(pc(tv))}">${tv>0?pc(tv)+' %':'—'}</div></div></div>
   <table style="margin-top:10px"><thead><tr><th>${{dia:'Día',sem:'Semana',mes:'Mes',ano:'Año'}[PPER]}</th><th class="r">Ventas</th><th class="r">Personal</th><th class="r">%</th></tr></thead><tbody>
   ${ks.map(k=>{const g=G[k],q=g.v>0?Math.round(g.p/g.v*100):null;return `<tr><td>${esc(et(k))}<div class="split" style="height:6px;margin-top:4px;max-width:140px"><i style="flex:${Math.min(100,q==null?100:q)};background:${q==null?'#A3231F':col(q)}"></i><i style="flex:${Math.max(0,100-(q==null?100:q))};background:transparent"></i></div></td><td class="r">${eur(r2(g.v))}</td><td class="r">${eur(r2(g.p))}</td><td class="r"><b style="color:${q==null?'#A3231F':col(q)}">${q==null?'sin caja':q+' %'}</b></td></tr>`}).join('')}</tbody></table>
   <p class="muted" style="font-size:12.5px;margin:8px 0 0">Ventas: cierres de caja (y lo de hoy si la caja está abierta). Personal: el coste empresa de la nómina de cada camarero repartido entre los días del mes (se pone en «Datos» de su ficha) más las horas extra a ${eur(config().extra)}/h. Verde hasta 30 %, naranja hasta 40 %, rojo por encima.</p></section>`}
function vCajas(){
  const k=EST&&EST.caja;let ahora='';

    ahora=vk.abierta?`<section class="card"><div class="row"><h2 style="margin:0">Caja abierta</h2><span class="sp"></span><span class="pill p-ok">desde las ${hhmm(vk.desde)}</span></div>

  else if(EST)ahora=`<section class="card"><div class="row"><h2 style="margin:0">Caja cerrada</h2><span class="sp"></span><span class="pill p-mute">${k&&k.deja!=null?'deja '+eur(k.deja)+' de cambio':'—'}</span></div></section>`;
  const L=cierres().filter(c=>diaC(c).slice(0,7)===MES).sort((a,b)=>(b.desde||b.hasta)-(a.desde||a.hasta));

  const tot={v:S(c=>c.ventas),ef:S(c=>c.ef),tj:S(c=>c.tj),dat:S(c=>c.datafono),sob:S(c=>(+c.retirado||0)+(+c.retDurante||0)),des:S(c=>c.desc)};

    lista+=`<button class="it" data-ci="${i}"><div class="sp"><div class="t">${hhmm(c.desde||c.hasta)}–${cierreTxt(c)} · ${esc(c.cerro||'')}</div><div class="s">Sobre ${c.retirado==null&&!c.retDurante?'—':eur((+c.retirado||0)+(+c.retDurante||0))} · Datáfono ${c.datafono==null?'—':eur(c.datafono)}</div></div>
      <div><div class="n">${eur(c.ventas)}</div><div style="text-align:right">${Math.abs(c.desc||0)<.005?'<span class="pill p-ok">Cuadra</span>':`<span class="pill ${c.desc>0?'p-warn':'p-bad'}">${c.desc>0?'+':''}${eur(c.desc)}</span>`}</div></div></button>`});
  return ahora+`<section class="card"><div class="nav"><button class="btn sm" id="mp" aria-label="Mes anterior">‹</button><b>${mesTxt(MES)}</b><button class="btn sm" id="mn" aria-label="Mes siguiente" ${MES>=ymd(Date.now()).slice(0,7)?'disabled':''}>›</button></div>
    <div class="kpis" style="margin-top:12px"><div class="kpi big"><div class="l">Ventas</div><div class="v">${eur(tot.v)}</div></div><div class="kpi"><div class="l">En sobres</div><div class="v">${eur(tot.sob)}</div></div><div class="kpi"><div class="l">Datáfono</div><div class="v">${eur(tot.dat)}</div></div><div class="kpi"><div class="l">Efectivo cobrado</div><div class="v">${eur(tot.ef)}</div></div><div class="kpi"><div class="l">Tarjeta cobrada</div><div class="v">${eur(tot.tj)}</div></div><div class="kpi"><div class="l">Descuadre</div><div class="v">${Math.abs(tot.des)<.005?'0,00 €':eur(tot.des)}</div></div></div></section>
  ${grafMes(L)}${vPersonal()}<section class="card"><h2>Cierres de caja (${L.length})</h2><div class="list">${lista||'<p class="muted" style="margin:0">No hay cierres este mes.</p>'}</div></section>`}
function aCajas(){activaGraf();$$('[data-pper]').forEach(b=>b.onclick=()=>{PPER=b.dataset.pper;lsP('ohp-pper',PPER);pinta()});$('#mp').onclick=()=>{MES=mesMas(MES,-1);pinta()};$('#mn').onclick=()=>{MES=mesMas(MES,1);pinta()};

const DEN=[['50 €',50],['20 €',20],['10 €',10],['5 €',5],['2 €',2],['1 €',1],['0,50 €',.5],['0,20 €',.2],['0,10 €',.1],['0,05 €',.05],['0,02 €',.02],['0,01 €',.01]];

function verCierre(c){if(!c)return;const b=c.billetes||{};const bil=DEN.map(([l,v],i)=>+b[i]?`<tr><td>${l}</td><td class="r">${+b[i]}</td><td class="r">${eur(v*b[i])}</td></tr>`:'').join('');

  ${(c.retiradas||[]).length?`<section class="card"><h2>Retiradas durante el servicio</h2><table><tbody>${c.retiradas.map(y=>`<tr><td>${hhmm(y.t)}</td><td>${esc(y.who)}</td><td>${esc(y.nota||'')}</td><td class="r"><b>${eur(y.amt)}</b></td></tr>`).join('')}</tbody></table></section>`:''}

/* ---------- En directo (dueño, 23 nov 2026: «gráficos y cosas que están pasando en directo; aunque no tenga el control, ver lo que
   va pasando en caja»). La tablet manda «vivo» (cobros de hoy, lo más vendido, mesas, quién trabaja, retiradas y pedidos). Con base
   Redis en Vercel llega cada 30 s y aquí se mira cada 15 s; sin ella, cada 10-20 min y aquí se mira cada minuto. ---------- */
const C_EF='#C9601A', C_TJ='#0A7EA0', C_OT='#9A9289';
const tipoPago=h=>/^Efectivo/i.test(h||'')?'ef':/^Tarjeta/i.test(h||'')?'tj':'ot';
const num=v=>v>=1000?(Math.round(v/100)/10).toLocaleString('es-ES')+' mil':Math.round(v).toLocaleString('es-ES');
function techo(m){if(!(m>0))return 10;const p=Math.pow(10,Math.floor(Math.log10(m)));for(const k of [1,1.5,2,2.5,3,4,5,6,8,10])if(k*p>=m)return k*p;return 10*p}
const GRAF={};
/* Barras apiladas en SVG. cols: [{lab, segs:[{v,c}], tip}] */
function grafBarras(id,cols,aria){GRAF[id]=cols;if(!cols.length)return '';
  const W=340,H=160,pl=40,pr=4,pt=8,pb=22,n=cols.length;const max=Math.max(...cols.map(c=>c.segs.reduce((a,s)=>a+s.v,0)));const top=techo(max);
  const bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/top);let g='',b='';const paso=Math.ceil(n/9);
  [0,.5,1].forEach(f=>{const yy=y(top*f).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#E2DDD3" stroke-width="1"/><text x="${pl-5}" y="${+yy+3.5}" text-anchor="end" font-size="10" fill="#5E5850">${num(top*f)} €</text>`});
  cols.forEach((c,i)=>{const w=Math.max(2,Math.min(26,bw*.72)),x=pl+i*bw+(bw-w)/2;let acc=0;
    c.segs.forEach(s=>{if(!(s.v>0))return;const y0=y(acc+s.v),y1=y(acc)-(acc>0?2:0);if(y1-y0>0.3)b+=`<rect data-b="${i}" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${(y1-y0).toFixed(1)}" rx="${Math.min(4,w/2,(y1-y0)/2).toFixed(1)}" fill="${s.c}"/>`;acc+=s.v});
    b+=`<rect data-i="${i}" x="${(pl+i*bw).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H-pt}" fill="transparent" style="cursor:pointer"/>`;
    if(i%paso===0)b+=`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#5E5850">${esc(c.lab)}</text>`});
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(aria)}" data-graf="${id}">${g}${b}</svg><div class="cap" id="cap-${id}" aria-live="polite">Toca una barra para ver el detalle.</div>`}
function activaGraf(){$$('svg[data-graf]').forEach(sv=>{const id=sv.dataset.graf;sv.onclick=e=>{const t=e.target.closest('[data-i]');if(!t)return;const i=+t.dataset.i,c=GRAF[id][i];
  sv.querySelectorAll('[data-b]').forEach(r=>r.style.opacity=+r.dataset.b===i?1:.35);const cap=$('#cap-'+id);if(cap)cap.innerHTML=c.tip}})}
const leyenda=l=>`<div class="ley">${l.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}</div>`;

let VIVO=null, MODO='blob', tVivo=0, vivoLeyendo=false;

   ${MODO!=='redis'?`<p class="muted" style="margin:6px 0 0;font-size:12.5px">Ahora llega cada 10-20 min (almacén gratis). Para verlo cada 30 s, mira «Ajustes».</p>`:''}</section>`;
  if(!ab){const u=cierres().sort((a,b)=>(b.desde||b.hasta)-(a.desde||a.hasta))[0];
    h+=u?`<section class="card"><h2>Última caja · ${diaCorto(diaC(u))} (cerró ${cierreTxt(u)})</h2><div class="kpis"><div class="kpi big"><div class="l">Ventas</div><div class="v">${eur(u.ventas)}</div></div><div class="kpi"><div class="l">Retirado</div><div class="v">${eur((+u.retirado||0)+(+u.retDurante||0))}</div></div><div class="kpi"><div class="l">Descuadre</div><div class="v">${Math.abs(u.desc||0)<.005?'Cuadra':eur(u.desc)}</div></div></div></section>`:'';
    return h+vValResumen()+vPedResumen()}
  const n=C.length,med=n?r2(tot/n):0;
  // Mismo día de la semana, últimas 4 semanas
  const dS=new Date().getDay(),porDia={};cierres().forEach(c=>{const d=diaC(c);if(d<ymd(Date.now())&&Date.now()-c.hasta<29*864e5&&new Date(d+'T12:00:00').getDay()===dS)porDia[d]=(porDia[d]||0)+(+c.ventas||0)});
  const dd=Object.values(porDia),media=dd.length?r2(dd.reduce((a,b)=>a+b,0)/dd.length):null;

/* ---------- Pedidos (dueño, 23 nov 2026: «una pestaña para la falta, todo lo que hay que pedir; enlazar el móvil de cada proveedor y

const telWa=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===9&&/^[6789]/.test(d))d='34'+d;return d.length>=10?d:''};

     <table style="margin-top:8px"><thead><tr><th>Producto</th><th class="r">Hay</th><th class="r">Pedir</th></tr></thead><tbody>${l.map(r=>`<tr><td><b>${esc(r.nm)}</b>${r.who?`<div class="muted" style="font-size:12.5px">Lo apuntó ${esc(r.who)}${r.t?' a las '+hhmm(r.t):''}</div>`:''}</td><td class="r">${esc(r.hay)}</td><td class="r"><b>${esc(r.q)}</b></td></tr>`).join('')}</tbody></table>

  h+=`<section class="card"><h2>Teléfonos de los proveedores</h2><div class="list">${todos.map(nm=>{const t=telDe(nm);return `<button class="it" data-tel="${esc(nm)}"><div class="sp"><div class="t">${esc(nm)}</div><div class="s">${t?esc(t):'Sin WhatsApp'}</div></div><span class="pill ${t&&telWa(t)?'p-ok':'p-warn'}">${t&&telWa(t)?'WhatsApp':'Poner'}</span></button>`}).join('')||'<p class="muted" style="margin:0">La tablet aún no ha mandado proveedores.</p>'}</div>

/* Ventas de cada día del mes, en Cajas */
function grafMes(L){if(!L.length)return '';const ult=MES===ymd(Date.now()).slice(0,7)?new Date().getDate():new Date(+MES.slice(0,4),+MES.slice(5,7),0).getDate();const cols=[];
  for(let d=1;d<=ult;d++){const k=MES+'-'+String(d).padStart(2,'0');const X=L.filter(c=>diaC(c)===k);const e=r2(X.reduce((a,c)=>a+(+c.ef||0),0)),j=r2(X.reduce((a,c)=>a+(+c.tj||0),0)),v=r2(X.reduce((a,c)=>a+(+c.ventas||0),0)),o=Math.max(0,r2(v-e-j));
    cols.push({lab:String(d),segs:[{v:e,c:C_EF},{v:j,c:C_TJ},{v:o,c:C_OT}],tip:X.length?`<b>${diaTxt(k)}</b> · ${eur(v)} · efectivo ${eur(e)} · tarjeta ${eur(j)}`:`<b>${diaTxt(k)}</b> · sin cierre`})}
  return `<section class="card"><h2>Ventas de cada día</h2>${leyenda([[C_EF,'Efectivo'],[C_TJ,'Tarjeta']])}${grafBarras('mes',cols,'Ventas de cada día del mes, efectivo y tarjeta')}</section>`}


/* Resumen de horas por WhatsApp (dueño, 23 nov 2026: «compartirle por WhatsApp a Ely su resumen de las horas para que lo mire y
   esté de acuerdo: el desglose de las horas ordinarias de contrato y las extra, y que sea fácil»). Periodo: una semana (de lunes a
   domingo, que es como se cuentan las extra), un mes, o unos días sueltos (p. ej. el fin de semana). Si el camarero tiene móvil
   puesto, abre su chat; si no, WhatsApp pide a quién mandarlo. */
const hm=m=>{m=Math.round(m||0);const h=Math.floor(m/60),mm=m%60;return h&&mm?h+' h '+mm+' min':mm?mm+' min':h+' h'};
const diaLargo=d=>may(new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric'}));
function rangoTxt(a,b){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00'),mes=x=>x.toLocaleDateString('es-ES',{month:'long'});
  if(a===b)return 'del '+A.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  return A.getMonth()===B.getMonth()?`del ${A.getDate()} al ${B.getDate()} de ${mes(B)}`:`del ${A.getDate()} de ${mes(A)} al ${B.getDate()} de ${mes(B)}`}
/* Texto sencillo, sin asteriscos, para copiar y pegar (dueño, 23 nov 2026 16:25: «más fácil de leer, no tan revesado, un copia-pega»). */
/* Horas de un camarero, simple (dueño, 23 nov 2026 16:55: «que los fichajes de la tablet aparezcan aquí cada día, un botón para
   corregir cada día, y el resumen de los días que yo seleccione: ordinarias, extras y lo que le tengo que pagar, rápido para copiar
   y mandar por WhatsApp»). Las extra se cuentan por semana (lunes a domingo): dentro de cada semana, las primeras horas hasta las de
   contrato son ordinarias y lo que pasa de ahí es extra, en orden de día y hora. Así cada día sabe cuántas de sus horas son extra. */
function reparto(id){const x=camDe(id),uso={},r={};fichajes().filter(f=>f.p===id&&f.out).sort((a,b)=>a.in-b.in).forEach(f=>{const l=lunesDe(ymd(f.in)),lim=ordDe(x,l)*60,u=uso[l]||0,m=minDe(f),o=Math.max(0,Math.min(m,lim-u));uso[l]=u+m;r[f.k]={m,o,e:m-o}});return r}
/* Texto para el camarero: corto y con los totales en negrita de WhatsApp (dueño, 23 nov 2026 17:03). */
const diaCort=d=>may(new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric'}).replace('.',''));
function sumaPago(id,keys){const R=reparto(id);let m=0,o=0,e=0;fichajes().filter(f=>f.p===id&&f.out&&keys.has(f.k)).forEach(f=>{const r=R[f.k];if(r){m+=r.m;o+=r.o;e+=r.e}});return {m,o,e,eur:r2(e/60*config().extra)}}
function textoPago(id,keys){const x=camDe(id),R=reparto(id),nm=(x?x.nm:nombre(id)).split(' ')[0],t=sumaPago(id,keys);
  const L=fichajes().filter(f=>f.p===id&&f.out&&keys.has(f.k)).sort((a,b)=>a.in-b.in);
  return `*${nm} · horas*\n\n${L.map(f=>`${diaCort(ymd(f.in))}: ${hhmm(f.in)} a ${hhmm(f.out)} → ${hm(R[f.k].m)}`).join('\n')}\n\n*Total trabajado: ${hm(t.m)}*\n*Ordinarias: ${hm(t.o)}*\n*Extra: ${hm(t.e)}*\n*A pagar: ${eur(t.eur)}*`}
function hojaHoras(id){const x=camDe(id);let mes=ymd(Date.now()).slice(0,7);const sel=new Set();
  const draw=o=>{const c=config(),R=reparto(id),hoyM=ymd(Date.now()).slice(0,7);
    const L=fichajes().filter(f=>f.p===id&&ymd(f.in).slice(0,7)===mes).sort((a,b)=>b.in-a.in);
    [...sel].forEach(k=>{if(c.pagado[k])sel.delete(k)});const n=fichajes().filter(f=>f.p===id&&f.out&&sel.has(f.k)).length;const txt=n?textoPago(id,sel):'';const tel=telWa(x&&x.tel);
    o.firstChild.innerHTML=`<div class="row"><h3>${esc(x?x.nm:nombre(id))}</h3>${x?'<button class="btn sm" data-ed>Datos</button>':''}<button class="btn sm" data-x>Cerrar</button></div>
    <section class="card"><div class="nav"><button class="btn sm" data-mp aria-label="Mes anterior">‹</button><b>${mesTxt(mes)}</b><button class="btn sm" data-mn aria-label="Mes siguiente" ${mes>=hoyM?'disabled':''}>›</button></div>
     ${(()=>{const P=L.filter(f=>c.pagado[f.k]),N=L.filter(f=>f.out&&!c.pagado[f.k]);const sp=P.reduce((a,f)=>a+(+c.pagado[f.k].eur||0),0),np=sumaPago(id,new Set(N.map(f=>f.k)));
       return `<div class="kpis" style="margin-top:8px"><div class="kpi"><div class="l">Pagado este mes</div><div class="v">${eur(r2(sp))}</div></div><div class="kpi"><div class="l">Extra sin pagar</div><div class="v">${eur(np.eur)}</div></div></div>`})()}
     <p class="muted" style="font-size:13px;margin:8px 0">Marca los días que vas a pagar. «Corregir» cambia la hora. Los días pagados quedan bloqueados.</p>
     <div class="list">${L.map(f=>{const r=R[f.k],pg=c.pagado[f.k];if(pg)return `<div class="it" style="cursor:default;gap:10px;background:#EAF6EE;border-radius:10px;padding-left:8px"><span style="width:24px;flex:none;color:#1F7A47;font-weight:700;text-align:center">✓</span>
       <div class="sp"><div class="t">${diaLargo(ymd(f.in))}</div><div class="s">${hhmm(f.in)} a ${hhmm(f.out)} · ${hm(r?r.m:minDe(f))}${r&&r.e?' · '+hm(r.e)+' extra':''} · pagado el ${diaCorto(ymd(pg.at))}${pg.eur?' ('+eur(pg.eur)+')':''}</div></div>
       <button class="btn sm" data-unpay="${esc(f.k)}" style="background:#1F9D5A;color:#fff;border-color:#1F9D5A">Pagado</button></div>`;
       return `<div class="it" style="cursor:default;gap:10px">${f.out?`<input type="checkbox" data-sel="${esc(f.k)}" ${sel.has(f.k)?'checked':''} style="width:24px;height:24px;flex:none" aria-label="Marcar ${esc(diaLargo(ymd(f.in)))}">`:'<span style="width:24px;flex:none"></span>'}
       <label class="sp" for="" data-tg="${esc(f.k)}" style="cursor:pointer"><div class="t">${diaLargo(ymd(f.in))}</div><div class="s">${hhmm(f.in)} a ${f.out?hhmm(f.out)+' · '+hm(r.m)+(r.e?' · <b style="color:var(--ink)">'+hm(r.e)+' extra</b>':''):'<b style="color:#A3231F">sin salida</b>'}${f.corr?' · corregido':''}</div></label>
       <button class="btn sm" data-cor="${esc(f.k)}">Corregir</button></div>`}).join('')||'<p class="muted" style="margin:0">Sin fichajes este mes.</p>'}</div>
     <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">${L.some(f=>f.out&&!c.pagado[f.k])?'<button class="btn sm" data-all>Marcar lo que falta por pagar</button>':''}${n?'<button class="btn sm" data-none>Quitar marcas</button>':''}<button class="btn sm" data-add>Añadir un día</button></div></section>

    <button class="btn big" data-pay style="width:100%;font-size:17px;padding:14px;margin-bottom:8px;background:#1F9D5A;color:#fff;border-color:#1F9D5A">Pagado (${eur(sumaPago(id,sel).eur)})</button>
    <div style="display:flex;gap:8px"><button class="btn pri big" data-cp style="flex:1;font-size:17px;padding:14px">Copiar</button><a class="btn big" style="flex:1;font-size:17px;padding:14px" href="https://wa.me/${tel||''}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a></div>`
    :'<p class="muted" style="text-align:center;margin:6px 0 0">Marca uno o más días para ver el resumen.</p>'}`;
    const q=(k,f)=>{const e=o.querySelector(k);if(e)e.onclick=f};
    q('[data-x]',()=>o.remove());q('[data-ed]',()=>{o.remove();editaCam(id)});
    q('[data-mp]',()=>{mes=mesMas(mes,-1);draw(o)});q('[data-mn]',()=>{mes=mesMas(mes,1);draw(o)});

    o.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>editaFichaje(id,fichajes().find(f=>f.k===b.dataset.cor),()=>draw(o)));
    q('[data-all]',()=>{L.forEach(f=>f.out&&!c.pagado[f.k]&&sel.add(f.k));draw(o)});
    q('[data-pay]',()=>{const R2=reparto(id),ahora=Date.now();fichajes().filter(f=>f.p===id&&f.out&&sel.has(f.k)).forEach(f=>{const r=R2[f.k];c.pagado[f.k]={at:ahora,in:f.in,out:f.out,m:r.m,o:r.o,e:r.e,eur:r2(r.e/60*c.extra)}});
      sel.clear();guardaCfg('Marcado como pagado. Esos días quedan bloqueados.').then(()=>draw(o))});
    o.querySelectorAll('[data-unpay]').forEach(b=>b.onclick=()=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='¿Quitar pagado?';b.style.background='#A3231F';b.style.borderColor='#A3231F';return}
      delete c.pagado[b.dataset.unpay];guardaCfg('Quitado. Ya se puede corregir.').then(()=>draw(o))});q('[data-none]',()=>{sel.clear();draw(o)});q('[data-add]',()=>editaFichaje(id,null,()=>draw(o)));
    q('[data-cp]',()=>{const ok=()=>{toast('Copiado. Pégalo en WhatsApp.');const b=o.querySelector('[data-cp]');if(b)b.textContent='Copiado'};
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,()=>copiaVieja(txt)&&ok());else if(copiaVieja(txt))ok()})};
  const o=hoja('');draw(o)}
function copiaVieja(t){try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();if(!r)toast('No se pudo copiar: mantén pulsado el texto y copia.');return r}catch(e){toast('No se pudo copiar: mantén pulsado el texto y copia.');return false}}

/* Camareros */

  ${c.sinGuardar?`<div class="note">He cogido los camareros de la tablet con 20 h ordinarias por semana. Revísalos y toca uno para cambiar sus horas: al guardar quedan fijos.</div>`:''}

  ${olvidos.length?`<section class="card" style="border-color:#D9A441"><h2>Sin fichar la salida</h2><div class="list">${olvidos.map(f=>`<button class="it" data-olv="${esc(f.k)}"><div class="sp"><div class="t">${esc(nombre(f.p))} · ${diaCorto(ymd(f.in))}</div><div class="s">Entró a las ${hhmm(f.in)} y no fichó la salida</div></div><span class="pill p-warn">Corregir</span></button>`).join('')}</div></section>`:''}
  <section class="card"><div class="nav"><button class="btn sm" id="sp" aria-label="Semana anterior">‹</button><b>Semana ${semTxt(SEM)}</b><button class="btn sm" id="sn" aria-label="Semana siguiente" ${SEM>=hoyL?'disabled':''}>›</button></div>
   <div class="list" style="margin-top:6px">${filas||'<p class="muted" style="margin:8px 0 0">No hay camareros. Añade uno abajo.</p>'}</div></section>
  <section class="card"><div class="nav"><button class="btn sm" id="mp" aria-label="Mes anterior">‹</button><b>${mesTxt(MES)}</b><button class="btn sm" id="mn" aria-label="Mes siguiente" ${MES>=mesF?'disabled':''}>›</button></div>
   <table style="margin-top:10px"><thead><tr><th>Camarero</th><th class="r">Trabajadas</th><th class="r">Extra</th><th class="r">A pagar</th></tr></thead><tbody>${resM.map(r=>`<tr><td>${esc(r.x.nm)}</td><td class="r">${hTxt(r.tot)}</td><td class="r">${hTxt(r.extra)}</td><td class="r"><b>${eur(r.eur)}</b></td></tr>`).join('')||'<tr><td colspan="4" class="muted">—</td></tr>'}
   ${resM.length>1?`<tr><td><b>Total</b></td><td class="r">${hTxt(resM.reduce((a,r)=>a+r.tot,0))}</td><td class="r">${hTxt(resM.reduce((a,r)=>a+r.extra,0))}</td><td class="r"><b>${eur(resM.reduce((a,r)=>a+r.eur,0))}</b></td></tr>`:''}</tbody></table>
   <p class="muted" style="font-size:13px;margin:8px 0 0">Extra a ${eur(c.extra)}/h (se cambia en Ajustes). Cada semana cuenta en el mes de su domingo.</p></section>
  <button class="btn" id="cnew">Añadir camarero</button>
  ${c.camareros.some(x=>x.activo===false)?`<section class="card"><h2>De baja</h2><div class="list">${c.camareros.filter(x=>x.activo===false).map(x=>`<button class="it" data-cam="${esc(x.id)}"><div class="sp t">${esc(x.nm)}</div><span class="pill p-mute">de baja</span></button>`).join('')}</div></section>`:''}`}
function huerfanos(){const c=config(),n={};((EST&&EST.fichajes)||[]).forEach(f=>{if(!camDe(f.p)&&!c.alias[f.p])n[f.p]=(n[f.p]||0)+1});return Object.entries(n)}
function aCamareros(){$$('[data-olv]').forEach(b=>b.onclick=()=>{const f=fichajes().find(z=>z.k===b.dataset.olv);if(f)editaFichaje(f.p,f,()=>pinta())});
  $$('[data-alias]').forEach(sl=>sl.onchange=()=>{if(!sl.value)return;const c=config();c.alias[sl.dataset.alias]=sl.value;guardaCfg(sl.value==='-'?'Hecho: esos fichajes ya no cuentan.':'Hecho: ya cuentan en las horas de '+nombre(sl.value)+'.')});$$('[data-vk]').forEach(b=>b.onclick=()=>{const c=config();c.valida[b.dataset.vk]={st:b.dataset.st,por:'Isidro (móvil)',at:Date.now()};guardaCfg(b.dataset.st==='ok'?'Validada. La tablet lo recoge en menos de media hora.':'Rechazada: cuenta la hora a la que pulsó.')});$('#sp').onclick=()=>{SEM=masDias(SEM,-7);pinta()};$('#sn').onclick=()=>{SEM=masDias(SEM,7);pinta()};
  $('#mp').onclick=()=>{MES=mesMas(MES,-1);pinta()};$('#mn').onclick=()=>{MES=mesMas(MES,1);pinta()};
  $$('[data-cam]').forEach(b=>b.onclick=()=>hojaHoras(b.dataset.cam));
  $$('[data-wh]').forEach(b=>b.onclick=()=>hojaHoras(b.dataset.wh));
  $('#cnew').onclick=()=>editaCam(null)}
function verCam(id){const x=camDe(id);if(!x)return;let mes=MES;

    o.firstChild.innerHTML=`<div class="row"><h3>${esc(x.nm)}</h3><button class="btn sm" data-ed>Cambiar</button><button class="btn sm" data-x>Cerrar</button></div>
    <button class="btn pri" data-wa style="width:100%;margin-bottom:10px">Resumen de horas para enviarle (y corregir)</button>
    <section class="card"><dl class="kv"><dt>Horas ordinarias por semana</dt><dd>${ordDe(x,lunesDe(ymd(Date.now())))} h</dd><dt>Hora extra</dt><dd>${eur(config().extra)}</dd><dt>Móvil</dt><dd>${x.tel?esc(x.tel):'—'}</dd></dl></section>
    <section class="card"><div class="nav"><button class="btn sm" data-mp aria-label="Mes anterior">‹</button><b>${mesTxt(mes)}</b><button class="btn sm" data-mn aria-label="Mes siguiente" ${mes>=ymd(Date.now()).slice(0,7)?'disabled':''}>›</button></div>
     <table style="margin-top:10px"><thead><tr><th>Semana</th><th class="r">Trabajadas</th><th class="r">Ordinarias</th><th class="r">Extra</th></tr></thead><tbody>${r.sems.map(s=>`<tr><td>${semTxt(s.lunes)}${s.cerrada?'':' <span class="pill p-mute">en curso</span>'}</td><td class="r">${hTxt(s.min)}</td><td class="r">${hTxt(s.ord)}</td><td class="r">${s.extra?'<b>'+hTxt(s.extra)+'</b>':'—'}</td></tr>`).join('')}
     <tr><td><b>Mes</b></td><td class="r"><b>${hTxt(r.tot)}</b></td><td></td><td class="r"><b>${hTxt(r.extra)}</b></td></tr></tbody></table>
     <div class="kpis" style="margin-top:10px"><div class="kpi big"><div class="l">Extra a pagar</div><div class="v">${eur(r.eur)}</div></div></div></section>
    <section class="card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Fichajes</h2><span class="sp"></span><button class="btn sm" data-add>Añadir</button></div>
     <div class="list">${lst.map(f=>`<button class="it" data-f="${esc(f.k)}"><div class="sp"><div class="t">${diaCorto(ymd(f.in))}</div><div class="s">${hhmm(f.in)} – ${f.out?hhmm(f.out):'sin salida'}${f.corr?' · corregido':''}${f.mano||f.aMano?' · puesto a mano':''}${f.corr?'':camTxt(f)}</div></div><div class="n">${f.out?hTxt(minDe(f)):(Date.now()-f.in>14*3600e3?'<span class="pill p-bad">sin salida</span>':'<span class="pill p-ok">dentro</span>')}</div></button>`).join('')||'<p class="muted" style="margin:0">Sin fichajes este mes.</p>'}</div></section>`;

function editaCam(id){const c=config();const x=id?camDe(id):null;const hoyL=lunesDe(ymd(Date.now()));
  hoja(`<div class="row"><h3>${x?'Cambiar '+esc(x.nm):'Nuevo camarero'}</h3><button class="btn sm" data-x>Cancelar</button></div>

   <label class="f">Coste empresa al mes (€, el de la nómina)<input class="inp" id="ec" type="text" inputmode="decimal" placeholder="1109.32" value="${x&&x.cmes?x.cmes:''}"></label>
   <p class="muted" style="font-size:12.5px;margin:-6px 0 0">Es el «COSTE EMPRESA» de abajo de la nómina: sueldo más la seguridad social de la empresa. ${x&&x.cmes?'Su hora ordinaria sale a <b>'+eur(r2(x.cmes/(ordDe(x,lunesDe(ymd(Date.now())))*52/12)))+'</b>. ':''}Las horas extra van aparte, a ${eur(config().extra)}/h sin seguridad social.</p>
   <label class="f">Móvil (WhatsApp, para mandarle su resumen de horas)<input class="inp" id="et" type="tel" inputmode="tel" placeholder="600 000 000" value="${x&&x.tel?esc(x.tel):''}"></label>
   <div class="row"><label class="f">Horas ordinarias por semana<input class="inp" id="eo" type="number" min="0" max="60" step="0.5" inputmode="decimal" value="${x?ordDe(x,hoyL):20}"></label>

   <p class="muted" style="font-size:13px;margin:0">Lo que pase de estas horas en una semana (de lunes a domingo) cuenta como extra. Un cambio vale desde esa semana; las anteriores se quedan como estaban.</p>
   ${x?'':'<p class="muted" style="font-size:13px;margin:0">Saldrá en la tablet en unos minutos. La primera vez que entre, creará su clave de 4 números.</p>'}
   <button class="btn pri" id="eg">Guardar</button>${x?`<button class="btn ${x.activo===false?'':'bad'}" id="eb">${x.activo===false?'Volver a dar de alta':'Dar de baja'}</button>`:''}</section>`,(o,cierra)=>{
    o.querySelector('#eg').onclick=()=>{const nm=o.querySelector('#en').value.trim();const h=parseFloat(o.querySelector('#eo').value);const d=lunesDe(o.querySelector('#ed').value||hoyL);

      cierra();guardaCfg()};
    const eb=o.querySelector('#eb');if(eb)eb.onclick=()=>{x.activo=x.activo===false;cierra();guardaCfg(x.activo?'Dado de alta.':'Dado de baja. Ya no sale en la tablet.')}})}
const aHora=(d,t)=>{if(!d||!t)return null;const v=new Date(d+'T'+t+':00').getTime();return isNaN(v)?null:v};
function editaFichaje(id,f,despues){const c=config();if(f&&c.pagado[f.k]){toast('Ese día ya está pagado. Quita «Pagado» para cambiarlo.');return}const d0=f?ymd(f.in):ymd(Date.now());
  hoja(`<div class="row"><h3>${f?'Corregir fichaje':'Añadir fichaje'} · ${esc(nombre(id))}</h3><button class="btn sm" data-x>Cancelar</button></div>

   <div class="row"><label class="f">Entrada<input class="inp" id="fe" type="time" value="${f?hhmm(f.in):''}"></label><label class="f">Salida<input class="inp" id="fs" type="time" value="${f&&f.out?hhmm(f.out):''}"></label></div>
   <p class="muted" style="font-size:13px;margin:0">Si la salida es antes que la entrada, cuenta como del día siguiente (turno de noche). La tablet lo recoge en menos de media hora (allí queda apuntada también la hora original).</p>
   <div id="fm" role="alert"></div><button class="btn pri" id="fg">Guardar</button>${f?'<button class="btn bad" id="fb">Borrar este fichaje</button>':''}</section>`,(o,cierra)=>{
    o.querySelector('#fg').onclick=()=>{const d=o.querySelector('#fd').value,e=aHora(d,o.querySelector('#fe').value);let s=aHora(d,o.querySelector('#fs').value);
      if(!e){o.querySelector('#fm').innerHTML='<div class="err">Pon la hora de entrada.</div>';return}
      if(s&&s<=e)s+=24*3600e3;

      else if(f){c.fix[f.k]={in:e,out:s,at:Date.now()}}

    const fb=o.querySelector('#fb');if(fb)fb.onclick=()=>{if(fb.dataset.ok!=='1'){fb.dataset.ok='1';fb.textContent='Pulsa otra vez para borrarlo';return}
      if(f.mano)c.nuevos=c.nuevos.filter(z=>'n|'+z.id!==f.k);else c.fix[f.k]={x:1};cierra();guardaCfg('Fichaje borrado.').then(()=>despues&&despues())}})}

/* Ajustes */
function vAjustes(){const c=config();return `<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0">Horas extra</h2>
  <label class="f">Precio de la hora extra (€)<input class="inp" id="ax" type="number" min="0" step="0.5" inputmode="decimal" value="${c.extra}"></label><button class="btn pri" id="ag">Guardar</button></section>
